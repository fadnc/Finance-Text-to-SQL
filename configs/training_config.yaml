# Model Configuration
# The earlier TinyLlama baseline is kept in models/tinyllama-gretel-finance-sql
# for comparison; this run uses a 1.5B code model that still fits 4 GB VRAM.
model_name: Qwen/Qwen2.5-Coder-1.5B-Instruct
output_dir: models/qwen2.5-coder-1.5b-wikisql-sql
training_output_dir: models/qwen2.5-coder-1.5b-wikisql-sql-candidate

# Dataset Configuration
# Source: https://huggingface.co/datasets/gretelai/synthetic_text_to_sql
dataset:
  name: gretelai/synthetic_text_to_sql
  # Finance-focused project: use the finance-domain rows only.
  # Set to [] to train on all 100,000 rows across every domain.
  domains:
    - finance
  cache_dir: .hf_cache/datasets
  train_split: train
  eval_split: test
  validation_size: 0.1
  max_train_samples: null
  max_eval_samples: null
  prepared_dir: data/processed

# Optional cross-domain supervision. The finance-focused continuation uses a
# reproducible sample of Spider training rows to improve SQL structure coverage.
training_datasets:
  spider:
    include: true
    repo_id: griffith-bigdata/GRAST-SQL-Spider
    revision: d6702d32cd917b57d32d21bb41d027ee49fa0c3e
    train_file: spider_train_samples.json
    dev_file: spider_dev_samples.json
    license: CC-BY-SA-4.0
    validation_size: 0.1
    max_train_samples: 600
    finance_repeat: 3
    cache_dir: .hf_cache/hub
  # WikiSQL supplies broad single-table schema grounding (24,241 Wikipedia
  # tables). It has no joins/CTEs, so it supplements rather than replaces
  # Spider. The official dev split is used as validation.
  wikisql:
    include: true
    source_url: https://github.com/salesforce/WikiSQL/raw/master/data.tar.bz2
    sha256: 755c728ab188e364575705c8641f3fafd86fb089cb8b08e8c03f01832aae0881
    license: "Wikipedia-derived; see https://github.com/salesforce/WikiSQL (BSD-3-Clause code)"
    cache_dir: .hf_cache/wikisql
    max_train_samples: 8000
    max_validation_samples: 1000

# Paths
db_path: data/processed/finance.db

# Training Hyperparameters
batch_size: 1
gradient_accumulation_steps: 4
epochs: 1
learning_rate: 0.0002
max_seq_length: 512
seed: 42
logging_steps: 10

# Inference
generation_max_new_tokens: 256

# Schema Definition (centralized, used by the REST API demo)
schema: |
  CREATE TABLE users (user_id INT PRIMARY KEY, name TEXT, email TEXT, created_at DATE);
  CREATE TABLE accounts (account_id INT PRIMARY KEY, user_id INT, account_type TEXT, balance DECIMAL, currency TEXT);
  CREATE TABLE expenses (expense_id INT PRIMARY KEY, user_id INT, category TEXT, amount DECIMAL, date DATE, description TEXT);
  CREATE TABLE income (income_id INT PRIMARY KEY, user_id INT, source TEXT, amount DECIMAL, date DATE);
  CREATE TABLE budgets (budget_id INT PRIMARY KEY, user_id INT, category TEXT, monthly_limit DECIMAL, start_date DATE);
  CREATE TABLE transactions (txn_id INT PRIMARY KEY, account_id INT, txn_type TEXT, amount DECIMAL, date DATE, merchant TEXT);

# Schema (simple version for compact displays/examples)
schema_simple: "users(user_id, name, email, created_at), accounts(account_id, user_id, account_type, balance, currency), expenses(expense_id, user_id, category, amount, date, description), income(income_id, user_id, source, amount, date), budgets(budget_id, user_id, category, monthly_limit, start_date), transactions(txn_id, account_id, txn_type, amount, date, merchant)"
